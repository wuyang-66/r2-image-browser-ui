<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迅驰工具在线查询</title>
    <link rel="preconnect" href="https://xiaowuyang.dpdns.org">
    <link rel="preconnect" href="https://xiaowuya.dpdns.org">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --brand-color-from: #3b82f6;
            --brand-color-to: #14b8a6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }
        @keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-enter { animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .no-scroll { overflow: hidden; }

        .image-placeholder {
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        /* 自定义Toggle开关 */
        .toggle-checkbox:checked { right: 0; border-color: var(--brand-color-from); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--brand-color-from); }

        /* 彻底隐藏浏览器默认的搜索框清除按钮 */
        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration {
            -webkit-appearance: none;
            display: none !important;
        }

        .search-type-btn {
            padding: 8px 16px;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: 500;
            background-color: white;
            color: #475569;
        }
        .search-type-btn.active {
            background-color: var(--brand-color-from);
            color: white;
            border-color: var(--brand-color-from);
        }
        
        #modal-image { cursor: zoom-in; }

        /* 建议框滚动条 */
        #suggestions-box {
            max-height: 320px;
            overflow-y: auto;
        }
        #suggestions-box::-webkit-scrollbar { width: 6px; }
        #suggestions-box::-webkit-scrollbar-track { background: #f1f5f9; }
        #suggestions-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="antialiased text-slate-800">

    <div id="prefix-toggle-container" class="absolute top-4 right-4 z-20 flex items-center">
        <label for="prefix-toggle" class="text-sm text-slate-600 mr-3 cursor-pointer">自动添加 "XC" 前缀</label>
        <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
            <input type="checkbox" name="prefix-toggle" id="prefix-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" checked/>
            <label for="prefix-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <header class="text-center mb-8 md:mb-12 pt-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[var(--brand-color-from)] to-[var(--brand-color-to)]">
                迅驰工具在线查询
            </h1>
            <p class="mt-3 text-lg text-slate-500">首屏快速加载，支持向下翻页查询</p>
        </header>

        <div id="search-type-switcher" class="flex justify-center mb-6 space-x-2">
            <button data-type="id" class="search-type-btn active">按编号搜索</button>
            <button data-type="name" class="search-type-btn">按名称/关键词搜索</button>
        </div>

        <!-- 验证提示区域 -->
        <div class="max-w-3xl mx-auto h-6 mb-1 text-center">
            <p id="search-validation-msg" class="text-sm font-medium transition-all duration-200 opacity-0 transform translate-y-1"></p>
        </div>

        <div class="max-w-3xl mx-auto flex items-center space-x-2">
            <div class="relative flex-grow" id="search-container">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
                </div>
                <input type="search" id="search-input" placeholder="输入编号进行搜索..."
                       class="w-full pl-12 pr-10 py-3 text-base border-2 border-slate-200 rounded-full shadow-sm 
                              focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none
                              transition-all duration-300 ease-in-out"
                       autocomplete="off">
                <button id="clear-btn" class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer hidden">
                    <i data-lucide="x-circle" class="w-5 h-5 text-slate-400 hover:text-slate-600"></i>
                </button>
                
                <div id="suggestions-box" class="absolute z-40 w-full mt-2 bg-white rounded-2xl shadow-lg border border-slate-100 hidden">
                    <ul id="suggestions-list"></ul>
                </div>
            </div>
            
            <button id="search-btn" class="flex-shrink-0 px-6 py-3 font-semibold text-white bg-gradient-to-r from-[var(--brand-color-from)] to-[var(--brand-color-to)] rounded-full shadow-sm hover:opacity-90 disabled:opacity-50 transition-all">
                <span>搜索</span>
            </button>
        </div>
        
        <div id="results-count-container" class="max-w-3xl mx-auto mt-6 hidden"></div>
        <main id="gallery" class="mt-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></main>

        <!-- 加载更多 -->
        <div id="load-more-container" class="mt-12 mb-12 flex flex-col items-center hidden">
            <button id="load-more-btn" class="px-8 py-3 bg-white border border-slate-200 text-slate-600 rounded-full font-medium hover:bg-slate-50 transition-colors shadow-sm flex items-center">
                <span id="load-more-text">加载更多结果</span>
                <i id="load-more-icon" data-lucide="chevron-down" class="ml-2 w-4 h-4"></i>
            </button>
        </div>

        <div id="gallery-message" class="mt-12"></div>
    </div>
    
    <!-- 详情弹窗 -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-overlay" class="absolute inset-0 bg-black/70 fade-in-bg"></div>
        <div id="modal-content" class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col md:flex-row overflow-hidden modal-enter">
            <div class="w-full md:w-3/5 bg-slate-100 flex items-center justify-center p-4 relative">
                <button id="modal-close-btn" class="absolute top-3 right-3 text-slate-500 hover:text-slate-800 transition-colors z-20 bg-white/50 rounded-full p-1">
                    <i data-lucide="x" class="w-7 h-7"></i>
                </button>
                <img id="modal-image" src="" alt="详情图片" class="max-w-full max-h-[40vh] md:max-h-[80vh] object-contain">
            </div>
            <div class="w-full md:w-2/5 p-8 overflow-y-auto">
                <h2 id="modal-title" class="text-3xl font-bold text-slate-800"></h2>
                <div class="mt-6 space-y-4 text-slate-600">
                    <div>
                        <h3 class="font-semibold text-slate-800">产品名称</h3>
                        <p id="modal-product-name"></p>
                    </div>
                    <div>
                        <h3 class="font-semibold text-slate-800">功能用途</h3>
                        <p id="modal-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 查看器 -->
    <div id="image-viewer" class="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <img id="viewer-image" src="" alt="全尺寸图片" class="max-w-[95vw] max-h-[95vh] object-contain rounded-lg shadow-2xl"/>
        <button id="viewer-close-btn" class="absolute top-4 right-4 text-white/80 hover:text-white transition-colors">
            <i data-lucide="x" class="w-10 h-10"></i>
        </button>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const CONFIG = {
            API_WORKER_URL: "https://xiaowuyang.dpdns.org",
            R2_BUCKET_URL: "https://xiaowuya.dpdns.org",
            PAGE_LIMIT: 12,
            DEFAULT_PREFIX: "XC"
        };
        const state = { 
            debounceTimer: null, 
            isPrefixEnabled: true, 
            searchType: 'id',
            isValid: true,
            isLoading: false,
            nextCursor: null,
            nextOffset: 0,
            hasMore: false
        };
        
        const els = {
            searchInput: document.getElementById('search-input'),
            clearBtn: document.getElementById('clear-btn'),
            searchBtn: document.getElementById('search-btn'),
            gallery: document.getElementById('gallery'),
            galleryMsg: document.getElementById('gallery-message'),
            suggestionsBox: document.getElementById('suggestions-box'),
            suggestionsList: document.getElementById('suggestions-list'),
            loadMoreContainer: document.getElementById('load-more-container'),
            loadMoreBtn: document.getElementById('load-more-btn'),
            loadMoreText: document.getElementById('load-more-text'),
            loadMoreIcon: document.getElementById('load-more-icon'),
            resultsCount: document.getElementById('results-count-container'),
            validationMsg: document.getElementById('search-validation-msg'),
            prefixToggle: document.getElementById('prefix-toggle'),
            prefixContainer: document.getElementById('prefix-toggle-container'),
            modal: document.getElementById('modal'),
            modalImg: document.getElementById('modal-image'),
            viewer: document.getElementById('image-viewer'),
            viewerImg: document.getElementById('viewer-image')
        };

        function showMessage(type, message) {
            els.gallery.innerHTML = '';
            els.resultsCount.classList.add('hidden');
            els.loadMoreContainer.classList.add('hidden');
            let icon = type === 'loading' ? 'loader-2' : (type === 'error' ? 'alert-triangle' : 'search');
            let color = type === 'loading' ? 'text-blue-500' : (type === 'error' ? 'text-red-500' : 'text-slate-400');
            els.galleryMsg.innerHTML = `<div class="flex flex-col items-center justify-center min-h-[30vh] text-slate-500">
                <i data-lucide="${icon}" class="w-12 h-12 ${type === 'loading' ? 'animate-spin' : ''} ${color}"></i>
                <p class="mt-4 text-lg text-center">${message}</p>
            </div>`;
            lucide.createIcons();
        }

        // 验证逻辑
        function checkValidation() {
            const val = els.searchInput.value;
            let isValid = true;
            let msg = "";

            if (state.searchType === 'id') {
                let effective = (state.isPrefixEnabled && val.startsWith(CONFIG.DEFAULT_PREFIX)) ? 
                                val.substring(CONFIG.DEFAULT_PREFIX.length) : val;
                
                if (effective.length > 0 && effective.length < 2) {
                    isValid = false;
                    msg = `编号搜索必须输入至少两位字符（不含"${CONFIG.DEFAULT_PREFIX}"）`;
                }
            }

            state.isValid = isValid;
            if (!isValid) {
                els.validationMsg.textContent = msg;
                els.validationMsg.className = "text-sm font-medium transition-all opacity-100 text-red-500 transform translate-y-0";
                els.searchBtn.disabled = true;
            } else {
                els.validationMsg.className = "text-sm font-medium transition-all opacity-0 transform translate-y-1";
                els.searchBtn.disabled = false;
            }
            return isValid;
        }

        function updateClearBtnVisibility() {
            const val = els.searchInput.value;
            const isJustPrefix = state.isPrefixEnabled && state.searchType === 'id' && val === CONFIG.DEFAULT_PREFIX;
            els.clearBtn.classList.toggle('hidden', val === '' || isJustPrefix);
        }

        function renderCards(images, append = false) {
            if (!append) els.gallery.innerHTML = '';
            
            const fragment = document.createDocumentFragment();
            images.forEach((img) => {
                const originalUrl = `${CONFIG.R2_BUCKET_URL}/${img.key}`;
                const thumb = `${CONFIG.API_WORKER_URL}/cdn-cgi/image/width=400,height=400,fit=cover,format=auto,quality=75/${originalUrl}`;
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 group cursor-pointer';
                card.style.animation = `popIn 0.5s ease-out forwards`;
                
                // 将完整数据存入 dataset
                card.dataset.original = originalUrl;
                card.dataset.displayName = img.displayName;
                card.dataset.productName = img.productName;
                card.dataset.description = img.description || '正在完善中....';

                card.innerHTML = `
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        <div class="absolute inset-0 image-placeholder"><i data-lucide="image" class="w-8 h-8 text-slate-300"></i></div>
                        <img src="${thumb}" loading="lazy" class="w-full h-full object-cover opacity-0 transition-opacity duration-500">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><p class="text-white font-bold text-lg">查看详情</p></div>
                    </div>
                    <div class="p-3 bg-slate-50"><p class="text-sm font-semibold text-slate-600 text-center truncate">${img.productName}</p><p class="text-xs text-slate-400 text-center mt-1">${img.displayName}</p></div>
                `;
                const imgEl = card.querySelector('img');
                imgEl.onload = () => { imgEl.style.opacity = '1'; card.querySelector('.image-placeholder').style.display = 'none'; };
                
                // 预加载大图
                card.addEventListener('mouseenter', () => { new Image().src = originalUrl; }, {once: true});
                
                fragment.appendChild(card);
            });
            els.gallery.appendChild(fragment);
            lucide.createIcons();
        }

        async function performSearch(isLoadMore = false) {
            if (!state.isValid || state.isLoading) return;
            const query = els.searchInput.value.trim();
            if (!query || (state.isPrefixEnabled && state.searchType === 'id' && query === CONFIG.DEFAULT_PREFIX)) {
                if (!isLoadMore) showMessage('info', '请输入关键词开始搜索。');
                return;
            }

            state.isLoading = true;
            if (!isLoadMore) {
                state.nextCursor = null;
                state.nextOffset = 0;
                showMessage('loading', `正在搜索 "${query}"...`);
            } else {
                els.loadMoreBtn.disabled = true;
                els.loadMoreIcon.classList.add('animate-spin');
                els.loadMoreText.textContent = '正在加载...';
            }

            try {
                let url = `${CONFIG.API_WORKER_URL}/search?q=${encodeURIComponent(query)}&type=${state.searchType}&limit=${CONFIG.PAGE_LIMIT}`;
                if (state.searchType === 'name') url += `&offset=${state.nextOffset}`;
                else if (state.nextCursor) url += `&cursor=${encodeURIComponent(state.nextCursor)}`;

                const resp = await fetch(url);
                const data = await resp.json();

                if (data.success) {
                    if (!isLoadMore) els.galleryMsg.innerHTML = '';
                    renderCards(data.images, isLoadMore);
                    
                    state.hasMore = data.hasMore;
                    state.nextCursor = data.nextCursor;
                    state.nextOffset = data.nextOffset;

                    els.loadMoreContainer.classList.toggle('hidden', !state.hasMore);
                    
                    if (!isLoadMore && data.images.length > 0) {
                        els.resultsCount.innerHTML = `<div class="flex items-center text-sm text-slate-500"><i data-lucide="check-circle-2" class="w-4 h-4 mr-2 text-teal-500"></i>为您找到 ${data.images.length} 个结果</div>`;
                        els.resultsCount.classList.remove('hidden');
                        lucide.createIcons();
                    }
                } else {
                    showMessage('error', data.error || '未找到结果');
                }
            } catch (e) {
                showMessage('error', '连接服务器失败');
            } finally {
                state.isLoading = false;
                els.loadMoreBtn.disabled = false;
                els.loadMoreIcon.classList.remove('animate-spin');
                els.loadMoreText.textContent = '加载更多结果';
            }
        }

        async function fetchSuggestions(query) {
            if (!query || state.searchType !== 'id' || !state.isValid) return;
            try {
                const response = await fetch(`${CONFIG.API_WORKER_URL}/suggest?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data.success && data.suggestions) {
                    els.suggestionsList.innerHTML = '';
                    if (data.suggestions.length > 0) {
                        data.suggestions.forEach(s => {
                            const li = document.createElement('li');
                            li.className = 'px-4 py-3 cursor-pointer hover:bg-slate-100 transition-colors border-b border-slate-50 last:border-0';
                            li.textContent = s;
                            li.onmousedown = (e) => {
                                e.preventDefault();
                                els.searchInput.value = s;
                                els.suggestionsBox.classList.add('hidden');
                                checkValidation();
                                performSearch(false);
                            };
                            els.suggestionsList.appendChild(li);
                        });
                        els.suggestionsBox.classList.remove('hidden');
                    } else {
                        els.suggestionsBox.classList.add('hidden');
                    }
                }
            } catch (e) {}
        }

        // --- 事件绑定 ---
        
        els.searchInput.oninput = () => {
            // 开关开启时的前缀强制逻辑
            if (state.searchType === 'id' && state.isPrefixEnabled) {
                if (!els.searchInput.value.startsWith(CONFIG.DEFAULT_PREFIX)) {
                    els.searchInput.value = CONFIG.DEFAULT_PREFIX;
                }
            }
            checkValidation();
            updateClearBtnVisibility();
            
            clearTimeout(state.debounceTimer);
            state.debounceTimer = setTimeout(() => {
                fetchSuggestions(els.searchInput.value.trim());
            }, 300);
        };

        els.searchInput.onkeyup = (e) => { if (e.key === 'Enter') performSearch(false); };
        
        els.searchBtn.onclick = () => performSearch(false);
        els.loadMoreBtn.onclick = () => performSearch(true);

        els.clearBtn.onclick = () => {
            els.searchInput.value = (state.searchType === 'id' && state.isPrefixEnabled) ? CONFIG.DEFAULT_PREFIX : '';
            checkValidation();
            updateClearBtnVisibility();
            els.gallery.innerHTML = '';
            els.suggestionsBox.classList.add('hidden');
            els.searchInput.focus();
        };

        document.getElementById('search-type-switcher').onclick = (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            state.searchType = btn.dataset.type;
            
            document.querySelectorAll('.search-type-btn').forEach(b => b.classList.toggle('active', b === btn));
            els.prefixContainer.style.display = state.searchType === 'id' ? 'flex' : 'none';
            els.searchInput.placeholder = state.searchType === 'id' ? '输入编号进行搜索...' : '输入关键词进行搜索...';
            
            els.searchInput.value = (state.searchType === 'id' && state.isPrefixEnabled) ? CONFIG.DEFAULT_PREFIX : '';
            checkValidation();
            updateClearBtnVisibility();
            els.gallery.innerHTML = '';
            els.loadMoreContainer.classList.add('hidden');
            els.suggestionsBox.classList.add('hidden');
        };

        els.prefixToggle.onchange = () => {
            state.isPrefixEnabled = els.prefixToggle.checked;
            let val = els.searchInput.value;
            if (state.isPrefixEnabled) {
                if (!val.startsWith(CONFIG.DEFAULT_PREFIX)) els.searchInput.value = CONFIG.DEFAULT_PREFIX + val;
            } else {
                if (val.startsWith(CONFIG.DEFAULT_PREFIX)) els.searchInput.value = val.substring(CONFIG.DEFAULT_PREFIX.length);
            }
            checkValidation();
            updateClearBtnVisibility();
            els.searchInput.focus();
        };

        // 点击外部关闭建议框
        document.addEventListener('click', (e) => {
            if (!document.getElementById('search-container').contains(e.target)) {
                els.suggestionsBox.classList.add('hidden');
            }
        });

        // 详情弹窗逻辑
        els.gallery.onclick = (e) => {
            const card = e.target.closest('.group');
            if (!card) return;
            
            els.modalImg.src = card.dataset.original; // 核心：在这里设置图片
            document.getElementById('modal-title').textContent = card.dataset.displayName;
            document.getElementById('modal-product-name').textContent = card.dataset.productName;
            document.getElementById('modal-description').textContent = card.dataset.description;
            
            els.modal.classList.remove('hidden');
            document.body.classList.add('no-scroll');
        };

        document.getElementById('modal-overlay').onclick = () => { els.modal.classList.add('hidden'); document.body.classList.remove('no-scroll'); };
        document.getElementById('modal-close-btn').onclick = () => { els.modal.classList.add('hidden'); document.body.classList.remove('no-scroll'); };
        
        els.modalImg.onclick = () => {
            els.viewerImg.src = els.modalImg.src;
            els.viewer.classList.remove('hidden');
        };

        document.getElementById('viewer-close-btn').onclick = () => els.viewer.classList.add('hidden');
        els.viewer.onclick = (e) => { if (e.target !== els.viewerImg) els.viewer.classList.add('hidden'); };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                els.viewer.classList.add('hidden');
                els.modal.classList.add('hidden');
                document.body.classList.remove('no-scroll');
            }
        });

        // --- 初始化 ---
        lucide.createIcons();
        showMessage('info', '请选择搜索类型，然后输入关键词。');
        
        // 关键修复：首屏根据开关状态初始化前缀
        if (state.searchType === 'id' && state.isPrefixEnabled) {
            els.searchInput.value = CONFIG.DEFAULT_PREFIX;
            checkValidation();
            updateClearBtnVisibility();
        }
    });
    </script>
</body>
</html>
