<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迅驰工具在线查询</title>
    <link rel="preconnect" href="https://xiaowuyang.dpdns.org">
    <link rel="preconnect" href="https://xiaowuya.dpdns.org">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --brand-color-from: #3b82f6;
            --brand-color-to: #14b8a6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }
        @keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-enter { animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .no-scroll { overflow: hidden; }

        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; display: none !important; }

        @keyframes skeleton-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .img-skeleton {
            background: linear-gradient(90deg, #eef1f5 25%, #f8fafc 37%, #eef1f5 63%);
            background-size: 400% 100%;
            animation: skeleton-shimmer 1.4s ease infinite;
        }

        .search-type-btn {
            padding: 8px 16px; border-radius: 9999px; border: 1px solid #cbd5e1;
            cursor: pointer; transition: all 0.2s ease-in-out; font-weight: 500;
            background-color: white; color: #475569;
        }
        .search-type-btn.active { background-color: var(--brand-color-from); color: white; border-color: var(--brand-color-from); }
        
        #modal-image { cursor: zoom-in; }
        #suggestions-box { max-height: 320px; overflow-y: auto; }
        #suggestions-box::-webkit-scrollbar { width: 6px; }
        #suggestions-box::-webkit-scrollbar-track { background: #f1f5f9; }
        #suggestions-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .touch-badge { display: none; }
        @media (hover: none) {
            .touch-badge { display: flex; }
            .hover-overlay { display: none; }
        }

        #nav-mini-search { opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; }
        #nav-mini-search.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        #toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 70; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; }
        #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        /* 针对AI结果的高亮样式 */
        .ai-key { font-weight: 600; color: #4f46e5; margin-right: 4px; }
    </style>
</head>
<body class="antialiased text-slate-800">

    <div class="fixed top-0 left-0 right-0 h-14 bg-white/80 backdrop-blur-md border-b border-slate-200 z-40 flex items-center justify-between px-4 sm:px-6">
        <div class="flex items-center space-x-2">
            <button id="nav-home-btn" class="flex items-center space-x-1 text-slate-600 hover:text-blue-500 transition-colors bg-slate-100 hover:bg-blue-50 px-3 py-1.5 rounded-full font-medium text-sm">
                <i data-lucide="home" class="w-4 h-4"></i><span class="hidden sm:inline">首页</span>
            </button>
        </div>

        <div id="nav-mini-search" class="hidden sm:flex items-center flex-1 max-w-sm mx-4">
            <div class="relative w-full">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <input type="search" id="nav-search-input" placeholder="快速搜索..." aria-label="快速搜索"
                       class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-100 border border-transparent rounded-full focus:ring-2 focus:ring-blue-400 focus:bg-white outline-none transition-all" autocomplete="off">
            </div>
        </div>
        <button id="nav-search-icon-btn" class="sm:hidden flex items-center justify-center w-9 h-9 rounded-full bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-500 transition-colors" aria-label="搜索">
            <i data-lucide="search" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- 优化：轻量吐司提示条 -->
    <div id="toast" class="bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 mt-10">
        <header class="text-center mb-8 md:mb-12 pt-4">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[var(--brand-color-from)] to-[var(--brand-color-to)] cursor-pointer" id="main-title-logo">
                迅驰工具在线查询
            </h1>
            <p class="mt-3 text-lg text-slate-500">随时随地查询您的产品信息</p>
        </header>

        <div id="search-type-switcher" class="flex justify-center mb-6 space-x-2">
            <button data-type="id" class="search-type-btn active">按编号搜索</button>
            <button data-type="name" class="search-type-btn">按名称/关键词搜索</button>
            <button data-type="image" class="search-type-btn">📷 图片搜索</button>
        </div>

        <div class="max-w-3xl mx-auto h-6 mb-1 text-center">
            <p id="search-validation-msg" class="text-sm font-medium transition-all duration-200 opacity-0 transform translate-y-1"></p>
        </div>

        <div class="max-w-3xl mx-auto flex items-center space-x-2">
            <div class="relative flex-grow" id="search-container">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i data-lucide="search" class="w-5 h-5 text-slate-400"></i></div>
                <div id="visual-prefix" class="absolute inset-y-0 left-10 flex items-center font-bold text-slate-400 pointer-events-none transition-opacity duration-200">XC</div>
                <input type="search" id="search-input" placeholder="输入编号进行搜索..."
                       class="w-full pl-16 pr-10 py-3 text-base border-2 border-slate-200 rounded-full shadow-sm 
                              focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none
                              transition-all duration-300 ease-in-out" autocomplete="off">
                <button id="clear-btn" class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer hidden">
                    <i data-lucide="x-circle" class="w-5 h-5 text-slate-400 hover:text-slate-600"></i>
                </button>
                <div id="suggestions-box" class="absolute z-40 w-full mt-2 bg-white rounded-2xl shadow-lg border border-slate-100 hidden">
                    <ul id="suggestions-list"></ul>
                </div>
            </div>
            <button id="search-btn" class="flex-shrink-0 px-6 py-3 font-semibold text-white bg-gradient-to-r from-[var(--brand-color-from)] to-[var(--brand-color-to)] rounded-full shadow-sm hover:opacity-90 disabled:opacity-50 transition-all">
                <span>搜索</span>
            </button>
        </div>

        <!-- 📷 图片搜索上传区（默认隐藏） -->
        <div id="image-search-area" class="max-w-3xl mx-auto hidden">
            <label id="image-dropzone" class="flex flex-col items-center justify-center w-full h-56 border-2 border-dashed border-blue-300 rounded-2xl bg-white cursor-pointer hover:bg-blue-50 transition-colors">
                <i data-lucide="camera" class="w-10 h-10 text-blue-400"></i>
                <p class="mt-3 text-base font-medium text-slate-600">拍照或上传产品照片</p>
                <p class="mt-1 text-sm text-slate-400">识别相似编号图，支持 JPG / PNG / WEBP</p>
                <input type="file" id="image-file-input" accept="image/*" class="hidden"/>
            </label>
            <div id="image-preview-wrap" class="mt-4 hidden">
                <img id="image-preview" src="" class="max-h-64 mx-auto rounded-xl shadow border border-slate-200" alt="查询图片预览"/>
            </div>
            <p id="image-search-status" class="mt-3 text-center text-sm text-slate-500"></p>
        </div>

        <div id="hot-searches-container" class="max-w-3xl mx-auto mt-4 hidden items-center space-x-2 px-2 animate-fade-in">
            <span class="text-sm text-slate-500 flex items-center whitespace-nowrap shrink-0">
                <i data-lucide="flame" class="w-4 h-4 text-orange-500 mr-1"></i>热门搜索：
            </span>
            <div id="hot-searches-list" class="flex flex-wrap gap-2 items-center"></div>
        </div>

        <div id="search-history-container" class="max-w-3xl mx-auto mt-3 hidden items-center space-x-2 px-2">
            <span class="text-sm text-slate-500 flex items-center whitespace-nowrap shrink-0">
                <i data-lucide="history" class="w-4 h-4 text-slate-400 mr-1"></i>最近搜索：
            </span>
            <div id="search-history-list" class="flex flex-wrap gap-2 items-center"></div>
            <button id="clear-history-btn" class="text-xs text-slate-400 hover:text-red-500 transition-colors shrink-0">清除</button>
        </div>
        
        <div id="results-count-container" class="max-w-3xl mx-auto mt-6 hidden"></div>
        
        <div id="recent-title" class="max-w-7xl mx-auto mt-10 mb-2 hidden flex items-center justify-between">
            <div class="flex items-center text-xl font-bold text-slate-700" id="main-section-title">
                <i data-lucide="sparkles" class="w-6 h-6 text-amber-500 mr-2" id="main-section-icon"></i>
                <span id="main-section-text">近期更新</span>
            </div>
        </div>

        <main id="gallery" class="mt-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></main>

        <div id="load-more-container" class="mt-8 mb-12 flex justify-center hidden w-full h-10">
            <div id="infinite-spinner" class="flex items-center space-x-2 text-slate-400 hidden">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                <span class="text-sm font-medium">加载中...</span>
            </div>
        </div>

        <div id="gallery-message" class="mt-12"></div>
    </div>

    <!-- 弹窗部分 -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-overlay" class="absolute inset-0 bg-black/70 fade-in-bg"></div>
        <div id="modal-content" class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col md:flex-row overflow-hidden modal-enter">
            <div class="w-full md:w-3/5 bg-slate-100 flex items-center justify-center p-4 relative min-h-[300px]">
                <div id="modal-img-loader" class="absolute inset-0 flex items-center justify-center bg-slate-100 z-10"><i data-lucide="loader-2" class="w-10 h-10 text-blue-500 animate-spin"></i></div>
                <button id="modal-close-btn" aria-label="关闭详情" class="absolute top-3 right-3 text-slate-500 hover:text-slate-800 transition-colors z-30 bg-white/80 shadow-sm rounded-full p-1"><i data-lucide="x" class="w-7 h-7"></i></button>
                <img id="modal-image" src="" alt="详情图片" class="max-w-full max-h-[40vh] md:max-h-[80vh] object-contain relative z-20 opacity-0 transition-opacity duration-300">
            </div>
            <div class="w-full md:w-2/5 p-8 overflow-y-auto relative">
                
                <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-4">
                    <h2 id="modal-title" class="text-3xl font-bold text-slate-800"></h2>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <!-- AI 解析触发按钮 (仅测试人员可用) -->
                        <button id="modal-ai-btn" class="flex items-center justify-center gap-1 px-3 py-1.5 text-sm font-medium text-white bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full shadow hover:shadow-md transition-all">
                            <i data-lucide="bot" class="w-4 h-4"></i><span class="hidden sm:inline">AI 解析此产品</span>
                        </button>
                        <button id="modal-copy-link-btn" aria-label="复制该产品的分享链接" title="复制分享链接" class="flex-shrink-0 mt-1 flex items-center justify-center w-9 h-9 rounded-full bg-slate-100 hover:bg-blue-50 text-slate-500 hover:text-blue-500 transition-colors">
                            <i data-lucide="link-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="mt-4 space-y-4 text-slate-600">
                    <div><h3 class="font-semibold text-slate-800">产品名称</h3><p id="modal-product-name"></p></div>
                    <div><h3 class="font-semibold text-slate-800">功能用途</h3><p id="modal-description" class="whitespace-pre-wrap"></p></div>
                </div>

                <!-- 🌟 专属展示区：历史已保存的 AI 参考信息 -->
                <div id="modal-ai-display-container" class="hidden mt-6 p-6 bg-indigo-50 rounded-xl border border-indigo-100 relative">
                    <div class="text-center mb-3">
                        <h3 class="font-bold text-indigo-800 flex items-center justify-center text-sm">
                            <i data-lucide="sparkles" class="w-4 h-4 mr-1 text-indigo-500"></i> AI 补充参考
                        </h3>
                        <span class="inline-block mt-1.5 text-[11px] font-normal bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full">(此内容为AI分析，仅供参考！)</span>
                    </div>
                    <div id="modal-ai-display-content" class="text-sm text-indigo-900 whitespace-pre-wrap leading-relaxed"></div>
                </div>

                <!-- 新解析出来的临时结果及保存区 -->
                <div id="modal-ai-analysis-container" class="hidden mt-6 p-4 bg-white rounded-xl border-2 border-indigo-200 shadow-lg relative animate-[popIn_0.3s_ease-out]">
                    <h3 class="font-bold text-indigo-800 mb-3 flex items-center border-b border-indigo-100 pb-2">
                        <i data-lucide="zap" class="w-5 h-5 mr-1 text-amber-500"></i> 解析预览 (未保存)
                    </h3>
                    <div id="modal-ai-analysis-content" class="text-sm text-slate-700 space-y-2 mb-4"></div>
                    <div class="flex justify-end">
                        <button id="modal-ai-save-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow transition-colors flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i>是，保存并对所有人展示
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <div id="image-viewer" class="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <img id="viewer-image" src="" class="max-w-[95vw] max-h-[95vh] object-contain rounded-lg shadow-2xl"/>
        <button id="viewer-close-btn" aria-label="关闭大图" class="absolute top-4 right-4 text-white/80 hover:text-white transition-colors"><i data-lucide="x" class="w-10 h-10"></i></button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const CONFIG = {
            API_WORKER_URL: "https://xiaowuyang.dpdns.org",
            R2_BUCKET_URL: "https://xiaowuya.dpdns.org",
            PAGE_LIMIT: 12,
            DEFAULT_PREFIX: "XC",
            MAX_RECENT_LIMIT: 36 // 限制近期更新最多加载 36 条
        };

        const state = { 
            debounceTimer: null, 
            isPrefixEnabled: true, 
            searchType: 'id',
            isValid: true,
            isLoading: false,
            nextCursor: null, 
            nextOffset: 0,
            hasMore: false,
            loadedCount: 0,
            currentView: 'recent'
        };
        
        let searchAbortController = null;
        let suggestAbortController = null;
        let currentAiData = null; // 缓存供保存使用的 AI 数据
        let currentTestPwd = '';

        const responseCache = new Map();
        const CACHE_TTL = 60000;
        async function cachedFetchJSON(url, signal) {
            const hit = responseCache.get(url);
            if (hit && (Date.now() - hit.time) < CACHE_TTL) return hit.data;
            const resp = await fetch(url, { signal });
            const data = await resp.json();
            if (data && data.success) {
                if (responseCache.size > 100) responseCache.clear();
                responseCache.set(url, { time: Date.now(), data });
            }
            return data;
        }

        const els = {
            searchContainer: document.getElementById('search-container'),
            searchInput: document.getElementById('search-input'),
            visualPrefix: document.getElementById('visual-prefix'),
            clearBtn: document.getElementById('clear-btn'),
            searchBtn: document.getElementById('search-btn'),
            gallery: document.getElementById('gallery'),
            galleryMsg: document.getElementById('gallery-message'),
            suggestionsBox: document.getElementById('suggestions-box'),
            suggestionsList: document.getElementById('suggestions-list'),
            loadMoreContainer: document.getElementById('load-more-container'),
            infiniteSpinner: document.getElementById('infinite-spinner'),
            resultsCount: document.getElementById('results-count-container'),
            recentTitle: document.getElementById('recent-title'), 
            validationMsg: document.getElementById('search-validation-msg'),
            hotSearchesContainer: document.getElementById('hot-searches-container'),
            hotSearchesList: document.getElementById('hot-searches-list'),
            historyContainer: document.getElementById('search-history-container'),
            historyList: document.getElementById('search-history-list'),
            clearHistoryBtn: document.getElementById('clear-history-btn'),
            navMiniSearch: document.getElementById('nav-mini-search'),
            navSearchInput: document.getElementById('nav-search-input'),
            navSearchIconBtn: document.getElementById('nav-search-icon-btn'),
            modal: document.getElementById('modal'),
            modalImg: document.getElementById('modal-image'),
            modalCopyLinkBtn: document.getElementById('modal-copy-link-btn'),
            modalAiBtn: document.getElementById('modal-ai-btn'),
            modalAiSaveBtn: document.getElementById('modal-ai-save-btn'),
            modalAiDisplayContainer: document.getElementById('modal-ai-display-container'),
            modalAiDisplayContent: document.getElementById('modal-ai-display-content'),
            modalAiAnalysisContainer: document.getElementById('modal-ai-analysis-container'),
            modalAiAnalysisContent: document.getElementById('modal-ai-analysis-content'),
            toast: document.getElementById('toast'),
            viewer: document.getElementById('image-viewer'),
            viewerImg: document.getElementById('viewer-image')
        };

        const observerOptions = { root: null, rootMargin: '300px', threshold: 0.1 };
        const loadMoreObserver = new IntersectionObserver((entries) => {
            const entry = entries[0];
            if (entry.isIntersecting && state.hasMore && !state.isLoading) {
                if (state.currentView === 'recent') loadRecentUpdates(true);
                else if (state.currentView === 'search') performSearch(true);
            }
        }, observerOptions);
        loadMoreObserver.observe(els.loadMoreContainer);

        const navSearchObserver = new IntersectionObserver((entries) => {
            const entry = entries[0];
            els.navMiniSearch.classList.toggle('visible', !entry.isIntersecting);
        }, { root: null, threshold: 0 });
        navSearchObserver.observe(els.searchContainer);

        els.navSearchInput.addEventListener('input', () => { els.searchInput.value = els.navSearchInput.value; });
        els.navSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                els.searchInput.value = els.navSearchInput.value;
                performSearch(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        els.navSearchIconBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => els.searchInput.focus(), 300);
        });

        document.addEventListener('click', (e) => {
            if (els.searchContainer && !els.searchContainer.contains(e.target)) els.suggestionsBox.classList.add('hidden');
        });

        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        };

        function showMessage(type, message) {
            els.gallery.innerHTML = '';
            els.resultsCount.classList.add('hidden');
            els.loadMoreContainer.classList.add('hidden');
            let icon = type === 'loading' ? 'loader-2' : (type === 'error' ? 'alert-triangle' : 'search');
            let color = type === 'loading' ? 'text-blue-500' : (type === 'error' ? 'text-red-500' : 'text-slate-400');
            els.galleryMsg.innerHTML = `<div class="flex flex-col items-center justify-center min-h-[30vh] text-slate-500">
                <i data-lucide="${icon}" class="w-12 h-12 ${type === 'loading' ? 'animate-spin' : ''} ${color}"></i>
                <p class="mt-4 text-lg text-center">${escapeHTML(message)}</p>
            </div>`;
            lucide.createIcons({ root: els.galleryMsg });
        }

        function renderSkeletonCards(count = 8) {
            els.gallery.innerHTML = '';
            els.galleryMsg.innerHTML = '';
            els.resultsCount.classList.add('hidden');
            els.loadMoreContainer.classList.add('hidden');
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < count; i++) {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden shadow-md';
                card.innerHTML = `
                    <div class="aspect-square img-skeleton"></div>
                    <div class="p-3 bg-slate-50 space-y-2">
                        <div class="h-3 w-3/4 mx-auto rounded img-skeleton"></div>
                        <div class="h-2 w-1/2 mx-auto rounded img-skeleton"></div>
                    </div>`;
                fragment.appendChild(card);
            }
            els.gallery.appendChild(fragment);
        }

        let toastTimer = null;
        function showToast(message) {
            els.toast.textContent = message;
            els.toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('visible'), 2500);
        }

        const HISTORY_KEY = 'xc_search_history';
        const HISTORY_MAX = 8;
        function getHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
        }
        function saveHistoryEntry(type, query) {
            if (!query) return;
            let list = getHistory().filter(h => !(h.type === type && h.query === query));
            list.unshift({ type, query });
            list = list.slice(0, HISTORY_MAX);
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
            renderHistory();
        }
        function renderHistory() {
            const list = getHistory();
            if (list.length === 0) { els.historyContainer.classList.add('hidden'); return; }
            els.historyList.innerHTML = '';
            list.forEach(h => {
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1 text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200 rounded-full hover:bg-slate-200 transition-colors cursor-pointer';
                btn.textContent = h.query;
                btn.onclick = () => {
                    document.querySelector(`[data-type="${h.type}"]`).click();
                    els.searchInput.value = h.type === 'id' ? h.query.replace(new RegExp('^' + CONFIG.DEFAULT_PREFIX, 'i'), '') : h.query;
                    els.clearBtn.classList.remove('hidden');
                    performSearch(false);
                };
                els.historyList.appendChild(btn);
            });
            els.historyContainer.classList.remove('hidden');
            els.historyContainer.classList.add('flex');
        }

        function getEffectiveQuery() {
            let rawVal = els.searchInput.value;
            let val = state.searchType === 'id' ? rawVal.replace(/\s+/g, '') : rawVal.trim();
            if (state.searchType === 'id' && state.isPrefixEnabled) {
                if (val.toUpperCase().startsWith(CONFIG.DEFAULT_PREFIX.toUpperCase())) {
                    val = val.substring(CONFIG.DEFAULT_PREFIX.length);
                    if (els.searchInput.value !== val) els.searchInput.value = val;
                }
                return val ? CONFIG.DEFAULT_PREFIX + val : '';
            }
            return val;
        }

        function updatePrefixUI() {
            const showPrefix = state.searchType === 'id' && state.isPrefixEnabled;
            if (showPrefix) {
                els.visualPrefix.classList.remove('hidden');
                els.searchInput.classList.replace('pl-12', 'pl-16');
            } else {
                els.visualPrefix.classList.add('hidden');
                els.searchInput.classList.replace('pl-16', 'pl-12');
            }
        }

        function renderCards(images, append = false) {
            if (!append) els.gallery.innerHTML = '';
            els.galleryMsg.innerHTML = ''; 
            
            const fragment = document.createDocumentFragment();
            images.forEach((img) => {
                const versionQuery = img.uploaded ? `?v=${img.uploaded}` : '';
                const originalUrl = `${CONFIG.R2_BUCKET_URL}/${img.key}${versionQuery}`;
                const thumb = `${CONFIG.API_WORKER_URL}/cdn-cgi/image/width=400,height=400,fit=cover,format=auto,quality=75/${originalUrl}`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 group cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-400 relative';
                card.style.animation = `popIn 0.5s ease-out forwards`;
                card.tabIndex = 0;
                card.setAttribute('role', 'button');

                card.dataset.original = originalUrl;
                card.dataset.key = img.key; 
                card.dataset.displayName = escapeHTML(img.displayName);
                card.dataset.productName = escapeHTML(img.productName);
                card.dataset.description = escapeHTML(img.description || '正在完善中....');
                // ✨ 绑定 AI 参考数据到卡片节点
                card.dataset.aiReference = img.ai_reference || '';
                
                card.setAttribute('aria-label', `查看 ${card.dataset.productName} 详情`);

                const newBadge = state.currentView === 'recent' ? `<div class="absolute top-2 right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm z-10 pointer-events-none">NEW</div>` : '';

                card.innerHTML = `
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        ${newBadge}
                        <div class="absolute inset-0 img-skeleton"></div>
                        <img src="${thumb}" loading="lazy" decoding="async"
                             class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300 pointer-events-none"
                             onload="this.style.opacity='1'; this.previousElementSibling.remove();" onerror="this.previousElementSibling.remove(); this.style.display='none';">
                        <div class="hover-overlay absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none"><p class="text-white font-bold text-lg">查看详情</p></div>
                        <div class="touch-badge absolute bottom-2 right-2 items-center gap-1 bg-black/60 text-white text-[11px] font-medium px-2 py-1 rounded-full pointer-events-none">
                            <i data-lucide="info" class="w-3 h-3"></i>详情
                        </div>
                    </div>
                    <div class="p-3 bg-slate-50"><p class="text-sm font-semibold text-slate-600 text-center truncate pointer-events-none">${card.dataset.productName}</p><p class="text-xs text-slate-400 text-center mt-1 pointer-events-none">${card.dataset.displayName}</p>${img.score !== undefined ? `<p class="text-xs text-blue-500 text-center font-semibold mt-1 pointer-events-none">相似度 ${(img.score * 100).toFixed(1)}%</p>` : ''}</div>
                `;
                fragment.appendChild(card);
            });
            els.gallery.appendChild(fragment);
            lucide.createIcons({ root: els.gallery });
        }

        function handleSearchResults(data, isLoadMore) {
             if (data.success) {
                if (!isLoadMore) state.loadedCount = 0;
                
                state.loadedCount += data.images.length;
                renderCards(data.images, isLoadMore);
                
                state.hasMore = data.hasMore;
                state.nextCursor = data.nextCursor;
                state.nextOffset = data.nextOffset;

                if (state.currentView === 'recent' && state.loadedCount >= CONFIG.MAX_RECENT_LIMIT) {
                    state.hasMore = false;
                }

                if (state.hasMore) {
                    els.loadMoreContainer.classList.remove('hidden');
                    els.infiniteSpinner.classList.add('hidden'); 
                } else {
                    els.loadMoreContainer.classList.add('hidden');
                }
                
                if (state.loadedCount > 0) {
                    let countText = '';
                    if (state.currentView === 'recent' && !state.hasMore && state.loadedCount >= CONFIG.MAX_RECENT_LIMIT) {
                        countText = `已为您展示最近的 ${state.loadedCount} 个更新记录`;
                    } else {
                        countText = state.hasMore ? `已加载 ${state.loadedCount} 个结果，向下滑动加载更多...` : `共为您找到 ${state.loadedCount} 个结果`;
                    }
                    els.resultsCount.innerHTML = `<div class="flex items-center text-sm text-slate-500"><i data-lucide="check-circle-2" class="w-4 h-4 mr-2 text-teal-500"></i>${countText}</div>`;
                    els.resultsCount.classList.remove('hidden');
                    lucide.createIcons({ root: els.resultsCount });
                } else if (!isLoadMore && data.images.length === 0) {
                    showMessage('error', '未找到结果');
                }
            } else {
                showMessage('error', data.error || '未找到结果');
            }
        }

        async function loadRecentUpdates(isLoadMore = false) {
            if (!isLoadMore) {
                state.currentView = 'recent';
                state.nextOffset = 0;
                els.searchInput.value = '';
                els.navSearchInput.value = '';
                els.clearBtn.classList.add('hidden');
                els.recentTitle.classList.remove('hidden');
                els.resultsCount.classList.add('hidden'); 
            }

            if (state.isLoading) return;
            state.isLoading = true;

            if (searchAbortController) searchAbortController.abort();
            searchAbortController = new AbortController();

            if (!isLoadMore) {
                renderSkeletonCards();
            } else {
                els.infiniteSpinner.classList.remove('hidden'); 
            }

            try {
                let url = `${CONFIG.API_WORKER_URL}/recent?limit=${CONFIG.PAGE_LIMIT}`;
                if (isLoadMore && state.nextOffset) url += `&offset=${state.nextOffset}`;
                
                const data = await cachedFetchJSON(url, searchAbortController.signal);

                if (data.success) {
                    if (data.images.length > 0 || isLoadMore) {
                        handleSearchResults(data, isLoadMore);
                    } else {
                        showMessage('info', '暂无记录');
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') showMessage('error', '加载失败，请重试');
            } finally {
                if (!searchAbortController.signal.aborted) state.isLoading = false;
            }
        }

        async function loadHotSearches() {
            try {
                const resp = await fetch(`${CONFIG.API_WORKER_URL}/hot-searches`);
                const data = await resp.json();
                
                if (data.success && data.hotSearches && data.hotSearches.length > 0) {
                    els.hotSearchesList.innerHTML = '';
                    data.hotSearches.forEach(keyword => {
                        const btn = document.createElement('button');
                        btn.className = 'px-3 py-1 text-xs font-medium bg-orange-50 text-orange-600 border border-orange-200 rounded-full hover:bg-orange-100 transition-colors shadow-sm cursor-pointer';
                        btn.textContent = keyword;
                        btn.onclick = () => {
                            let searchVal = keyword;
                            if (keyword.toUpperCase().startsWith(CONFIG.DEFAULT_PREFIX.toUpperCase())) {
                                document.querySelector('[data-type="id"]').click(); 
                                searchVal = keyword.substring(CONFIG.DEFAULT_PREFIX.length);
                            } else {
                                document.querySelector('[data-type="name"]').click(); 
                            }
                            els.searchInput.value = searchVal;
                            els.clearBtn.classList.remove('hidden');
                            performSearch(false);
                        };
                        els.hotSearchesList.appendChild(btn);
                    });
                    els.hotSearchesContainer.classList.remove('hidden');
                    els.hotSearchesContainer.classList.add('flex');
                    lucide.createIcons({ root: els.hotSearchesContainer });
                }
            } catch (e) {}
        }

        async function performSearch(isLoadMore = false) {
            if (state.searchType === 'image') return;
            els.suggestionsBox.classList.add('hidden');
            els.navSearchInput.value = els.searchInput.value;
            
            if (state.isLoading) return;
            const effectiveQuery = getEffectiveQuery();
            if (!effectiveQuery || (state.isPrefixEnabled && state.searchType === 'id' && effectiveQuery === CONFIG.DEFAULT_PREFIX)) {
                if (!isLoadMore) loadRecentUpdates();
                return;
            }

            state.isLoading = true;
            state.currentView = 'search';
            els.recentTitle.classList.add('hidden');

            if (searchAbortController) searchAbortController.abort();
            searchAbortController = new AbortController();

            if (!isLoadMore) {
                state.nextCursor = null; 
                state.nextOffset = 0;
                renderSkeletonCards();
                saveHistoryEntry(state.searchType, effectiveQuery);
            } else {
                els.infiniteSpinner.classList.remove('hidden'); 
            }

            try {
                let url = `${CONFIG.API_WORKER_URL}/search?q=${encodeURIComponent(effectiveQuery)}&type=${state.searchType}&limit=${CONFIG.PAGE_LIMIT}`;
                if (isLoadMore) {
                    if (state.searchType === 'name' && state.nextOffset) url += `&offset=${state.nextOffset}`;
                    else if (state.searchType === 'id' && state.nextCursor) url += `&cursor=${encodeURIComponent(state.nextCursor)}`;
                }

                const data = await cachedFetchJSON(url, searchAbortController.signal);
                handleSearchResults(data, isLoadMore);

            } catch (e) {
                if (e.name !== 'AbortError') showMessage('error', '连接服务器失败');
            } finally {
                if (!searchAbortController.signal.aborted) state.isLoading = false;
            }
        }
        
        async function fetchSuggestions(query) {
            if (!query || state.searchType !== 'id') {
                els.suggestionsBox.classList.add('hidden'); return;
            }
            const effectiveQuery = getEffectiveQuery();
            if (suggestAbortController) suggestAbortController.abort();
            suggestAbortController = new AbortController();

            try {
                const response = await fetch(`${CONFIG.API_WORKER_URL}/suggest?q=${encodeURIComponent(effectiveQuery)}`, { signal: suggestAbortController.signal });
                const data = await response.json();
                
                if (data.success && data.suggestions && data.suggestions.length > 0) {
                    els.suggestionsList.innerHTML = '';
                    data.suggestions.forEach(s => {
                        const li = document.createElement('li');
                        li.className = 'px-4 py-3 cursor-pointer hover:bg-slate-100 transition-colors border-b border-slate-50 last:border-0';
                        
                        let displayText = escapeHTML(s);
                        if (state.isPrefixEnabled && s.toUpperCase().startsWith(CONFIG.DEFAULT_PREFIX.toUpperCase())) {
                            displayText = escapeHTML(s.substring(CONFIG.DEFAULT_PREFIX.length));
                        }
                        li.innerHTML = `<span class="text-slate-400 font-medium">${state.isPrefixEnabled ? CONFIG.DEFAULT_PREFIX : ''}</span>${displayText}`;
                        
                        li.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            els.searchInput.value = displayText;
                            els.suggestionsBox.classList.add('hidden');
                            performSearch(false);
                        });
                        els.suggestionsList.appendChild(li);
                    });
                    els.suggestionsBox.classList.remove('hidden');
                } else {
                    els.suggestionsBox.classList.add('hidden');
                }
            } catch (e) {}
        }

        // --- 事件监听 ---
        document.querySelectorAll('.search-type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetBtn = e.target.closest('.search-type-btn');
                if (targetBtn.classList.contains('active')) return;

                document.querySelectorAll('.search-type-btn').forEach(b => b.classList.remove('active'));
                targetBtn.classList.add('active');
                
                state.searchType = targetBtn.dataset.type;
                state.isPrefixEnabled = (state.searchType === 'id');

                // 📷 图片搜索模式：隐藏输入框，显示上传区
                const isImage = state.searchType === 'image';
                els.searchContainer.style.display = isImage ? 'none' : '';
                document.getElementById('image-search-area').classList.toggle('hidden', !isImage);
                if (isImage) {
                    els.hotSearchesContainer.classList.add('hidden');
                    els.historyContainer.classList.add('hidden');
                    els.suggestionsBox.classList.add('hidden');
                } else {
                    if (els.hotSearchesList.children.length > 0) els.hotSearchesContainer.classList.remove('hidden');
                    renderHistory();
                }
                
                els.searchInput.placeholder = state.searchType === 'id' ? "输入编号进行搜索..." : "输入名称/关键词进行搜索...";
                updatePrefixUI();
                
                let rawVal = els.searchInput.value;
                if (state.searchType === 'id' && state.isPrefixEnabled) {
                     let upperPrefix = CONFIG.DEFAULT_PREFIX.toUpperCase();
                     if (rawVal.toUpperCase().startsWith(upperPrefix)) els.searchInput.value = rawVal.substring(upperPrefix.length).trimStart();
                }
                els.suggestionsBox.classList.add('hidden');
            });
        });
        
        els.searchInput.addEventListener('input', () => {
            let rawVal = els.searchInput.value;
            if (state.searchType === 'id' && state.isPrefixEnabled) {
                let trimmed = rawVal.trimStart();
                let upperPrefix = CONFIG.DEFAULT_PREFIX.toUpperCase();
                if (trimmed.toUpperCase().startsWith(upperPrefix)) {
                    els.visualPrefix.textContent = trimmed.substring(0, upperPrefix.length);
                    els.searchInput.value = trimmed.substring(upperPrefix.length).trimStart();
                } else if (els.searchInput.value === '') {
                    els.visualPrefix.textContent = CONFIG.DEFAULT_PREFIX;
                }
            }
            els.clearBtn.classList.toggle('hidden', els.searchInput.value === '');
            els.navSearchInput.value = els.searchInput.value;
            
            clearTimeout(state.debounceTimer);
            state.debounceTimer = setTimeout(() => {
                const val = state.searchType === 'id' ? els.searchInput.value.replace(/\s+/g, '') : els.searchInput.value.trim();
                if (val) fetchSuggestions(val);
                else els.suggestionsBox.classList.add('hidden');
            }, 300);
        });

        els.searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); performSearch(false); }
            else if (e.key === 'Escape') els.suggestionsBox.classList.add('hidden');
        });
        
        els.searchBtn.addEventListener('click', () => performSearch(false));

        els.clearBtn.addEventListener('click', () => {
            els.searchInput.value = '';
            els.navSearchInput.value = '';
            els.visualPrefix.textContent = CONFIG.DEFAULT_PREFIX;
            els.clearBtn.classList.add('hidden');
            if (searchAbortController) searchAbortController.abort();
            state.isLoading = false;
            els.suggestionsBox.classList.add('hidden');
            loadRecentUpdates();
            els.searchInput.focus();
        });

        els.gallery.addEventListener('click', (e) => {
            const card = e.target.closest('.group');
            if (!card) return;
            
            const originalUrl = card.dataset.original;
            const modalOptimizedUrl = `${CONFIG.API_WORKER_URL}/cdn-cgi/image/width=1200,fit=scale-down,format=auto,quality=85/${originalUrl}`;
            
            els.modalImg.classList.add('opacity-0');
            document.getElementById('modal-img-loader').classList.remove('hidden');
            
            els.modalImg.src = modalOptimizedUrl; 
            els.modalImg.dataset.fullOrigin = originalUrl;
            document.getElementById('modal-title').innerHTML = card.dataset.displayName;
            document.getElementById('modal-product-name').innerHTML = card.dataset.productName;
            const hasAiRef = card.dataset.aiReference && card.dataset.aiReference.trim() !== '';
            const isPlaceholderDesc = card.dataset.description === '正在完善中....' || /^[.\u2026\u3002\uFF0E\u00B7\u2022\s]*$/.test(card.dataset.description || '');
            document.getElementById('modal-description').innerHTML = (hasAiRef && isPlaceholderDesc) ? '' : card.dataset.description;
            els.modalCopyLinkBtn.dataset.shareQuery = card.dataset.displayName;
            
            // --- 🤖 重置 AI 相关模块 ---
            els.modalAiAnalysisContainer.classList.add('hidden');
            currentAiData = null;
            els.modalAiBtn.dataset.key = card.dataset.key;
            
            // 检查数据库中是否已存有 AI 参考数据，有就展现出来
            if (hasAiRef) {
                els.modalAiDisplayContent.innerText = card.dataset.aiReference;
                els.modalAiDisplayContainer.classList.remove('hidden');
            } else {
                els.modalAiDisplayContainer.classList.add('hidden');
            }
            
            els.modal.classList.remove('hidden');
            document.body.classList.add('no-scroll');
        });

        // --- 🤖 AI 触发解析交互 ---
        els.modalAiBtn.addEventListener('click', async () => {
            const pwd = prompt("此为内部测试功能，请输入授权密码：");
            if (!pwd) return;
            if (pwd !== 'xc666') { showToast("测试密码错误"); return; }

            const imgKey = els.modalAiBtn.dataset.key;
            const originalBtnHtml = els.modalAiBtn.innerHTML;
            
            els.modalAiBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span class="hidden sm:inline">解析中...</span>`;
            els.modalAiBtn.disabled = true; 
            els.modalAiBtn.classList.add('opacity-80', 'cursor-not-allowed');
            lucide.createIcons({ root: els.modalAiBtn });

            try {
                const res = await fetch(`${CONFIG.API_WORKER_URL}/api/ai-analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd, key: imgKey })
                });
                
                const data = await res.json();
                
                if (data.success && data.data) {
                    currentAiData = data.data;
                    currentTestPwd = pwd;
                    
                    let html = '';
                    if (currentAiData['产品名称']) html += `<p><span class="ai-key">识别名称:</span> ${currentAiData['产品名称']}</p>`;
                    if (currentAiData['英文名称']) html += `<p><span class="ai-key">英文名称:</span> ${currentAiData['英文名称']}</p>`;
                    if (currentAiData['主要功能']) html += `<p><span class="ai-key">主要功能:</span> ${currentAiData['主要功能']}</p>`;
                    if (currentAiData['适用车型']) html += `<p><span class="ai-key">适用车型:</span> ${currentAiData['适用车型']}</p>`;
                    
                    els.modalAiAnalysisContent.innerHTML = html || "<p>未能识别出相关信息</p>";
                    els.modalAiAnalysisContainer.classList.remove('hidden');
                    showToast("AI 视觉解析完成！确认无误可保存");
                } else {
                    showToast("解析失败: " + (data.error || '未知错误'));
                }
            } catch(e) {
                showToast("网络请求失败，请检查连通性");
            } finally {
                els.modalAiBtn.innerHTML = originalBtnHtml;
                els.modalAiBtn.disabled = false; 
                els.modalAiBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                lucide.createIcons({ root: els.modalAiBtn });
            }
        });

        // --- 🤖 AI 结果保存（物理隔离逻辑） ---
        els.modalAiSaveBtn.addEventListener('click', async () => {
            if (!currentAiData) return;
            const originalBtnHtml = els.modalAiSaveBtn.innerHTML;
            
            els.modalAiSaveBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>保存中...`;
            els.modalAiSaveBtn.disabled = true; 
            els.modalAiSaveBtn.classList.add('opacity-80', 'cursor-not-allowed');
            lucide.createIcons({ root: els.modalAiSaveBtn });

            try {
                const res = await fetch(`${CONFIG.API_WORKER_URL}/api/ai-save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: currentTestPwd,
                        key: els.modalAiBtn.dataset.key,
                        aiData: currentAiData
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    showToast("已成功保存AI分析内容，已对所有人可见");
                    
                    // 无刷新：把存好的数据同步到卡片的 dataset 里
                    const currentCard = document.querySelector(`.group[data-key="${els.modalAiBtn.dataset.key}"]`);
                    if (currentCard) {
                        currentCard.dataset.aiReference = data.ai_reference;
                    }
                    
                    // 无刷新：展示正式区，隐藏临时区
                    els.modalAiDisplayContent.innerText = data.ai_reference;
                    els.modalAiDisplayContainer.classList.remove('hidden');
                    els.modalAiAnalysisContainer.classList.add('hidden');

                    // 若"功能用途"目前展示的仍是占位省略号，保存AI参考后一并清除，避免观感矛盾
                    const descEl = document.getElementById('modal-description');
                    if (/^[.\u2026\u3002\uFF0E\u00B7\u2022\s]*$/.test(descEl.innerHTML) || descEl.innerHTML === '正在完善中....') descEl.innerHTML = '';
                } else {
                    showToast("保存失败: " + (data.error || '未知错误'));
                }
            } catch(e) {
                showToast("网络请求异常");
            } finally {
                els.modalAiSaveBtn.innerHTML = originalBtnHtml;
                els.modalAiSaveBtn.disabled = false; 
                els.modalAiSaveBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                lucide.createIcons({ root: els.modalAiSaveBtn });
            }
        });

        els.gallery.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.group');
            if (!card) return;
            e.preventDefault();
            card.click();
        });

        els.modalCopyLinkBtn.addEventListener('click', async () => {
            const q = els.modalCopyLinkBtn.dataset.shareQuery || '';
            const shareUrl = `${location.origin}${location.pathname}?type=name&q=${encodeURIComponent(q)}`;
            try {
                await navigator.clipboard.writeText(shareUrl);
                showToast('链接已复制');
            } catch (e) {
                showToast('复制失败，请手动复制');
            }
        });

        els.modalImg.onload = () => { els.modalImg.classList.remove('opacity-0'); document.getElementById('modal-img-loader').classList.add('hidden'); };

        const closeModal = () => { els.modal.classList.add('hidden'); document.body.classList.remove('no-scroll'); els.modalAiAnalysisContainer.classList.add('hidden'); };
        document.getElementById('modal-overlay').addEventListener('click', closeModal);
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        
        els.modalImg.addEventListener('click', () => { els.viewerImg.src = els.modalImg.dataset.fullOrigin || els.modalImg.src; els.viewer.classList.remove('hidden'); });
        const closeViewer = () => els.viewer.classList.add('hidden');
        document.getElementById('viewer-close-btn').addEventListener('click', closeViewer);
        els.viewer.addEventListener('click', (e) => { if (e.target !== els.viewerImg) closeViewer(); });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!els.viewer.classList.contains('hidden')) closeViewer();
            else if (!els.modal.classList.contains('hidden')) closeModal();
        });

        document.getElementById('nav-home-btn').addEventListener('click', () => { if (state.currentView !== 'recent') loadRecentUpdates(); });
        document.getElementById('main-title-logo').addEventListener('click', () => { if (state.currentView !== 'recent') loadRecentUpdates(); });

        function applyShareLinkIfPresent() {
            const params = new URLSearchParams(location.search);
            const q = params.get('q');
            if (!q) return false;
            const type = params.get('type') === 'name' ? 'name' : 'id';
            const targetBtn = document.querySelector(`[data-type="${type}"]`);
            if (targetBtn && !targetBtn.classList.contains('active')) targetBtn.click();
            els.searchInput.value = q;
            els.navSearchInput.value = q;
            els.clearBtn.classList.remove('hidden');
            performSearch(false);
            return true;
        }

        // ===== 📷 以图搜图（浏览器端 CLIP 向量 + Worker 检索） =====
        let clipModel = null, clipProcessor = null, transformersModule = null;

        async function loadClipModel() {
            if (clipModel) return;
            const status = document.getElementById('image-search-status');
            status.textContent = '首次使用需加载 AI 模型（约 90MB，只加载一次），请稍候...';
            transformersModule = await import(CONFIG.API_WORKER_URL + '/models/transformers.min.js');
            transformersModule.env.localModelPath = CONFIG.API_WORKER_URL + '/models/';
            transformersModule.env.allowRemoteModels = false;
            transformersModule.env.backends.onnx.wasm.wasmPaths = CONFIG.API_WORKER_URL + '/models/';
            clipProcessor = await transformersModule.AutoProcessor.from_pretrained('clip-vit-base-patch32');
            clipModel = await transformersModule.CLIPVisionModelWithProjection.from_pretrained('clip-vit-base-patch32', { quantized: true });
            status.textContent = '';
        }

        async function computeImageVector(file) {
            await loadClipModel();
            const bitmap = await createImageBitmap(file);
            const size = Math.max(bitmap.width, bitmap.height);
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(bitmap, (size - bitmap.width) / 2, (size - bitmap.height) / 2);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            const raw = await transformersModule.RawImage.fromBlob(blob);
            const inputs = await clipProcessor(raw);
            const { image_embeds } = await clipModel.getImageFeatures(inputs);
            const arr = image_embeds && image_embeds.data
                ? Array.from(image_embeds.data)
                : Array.isArray(image_embeds) ? image_embeds.flat() : Array.from(image_embeds || []);
            const norm = Math.sqrt(arr.reduce((s, v) => s + v * v, 0)) || 1;
            return arr.map(v => v / norm);
        }

        async function performImageSearch(file) {
            const status = document.getElementById('image-search-status');
            const preview = document.getElementById('image-preview');
            const wrap = document.getElementById('image-preview-wrap');
            preview.src = URL.createObjectURL(file);
            wrap.classList.remove('hidden');
            status.textContent = '⏳ 正在计算图片特征...';
            try {
                const vector = await computeImageVector(file);
                status.textContent = '⏳ 正在检索相似编号...';
                const res = await fetch(`${CONFIG.API_WORKER_URL}/api/image-search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vector })
                });
                const data = await res.json();
                if (data.success) {
                    state.currentView = 'search';
                    els.recentTitle.classList.add('hidden');
                    handleSearchResults(data, false);
                    status.textContent = '';
                } else {
                    status.textContent = '检索失败: ' + (data.error || '未知错误');
                }
            } catch (e) {
                status.textContent = '图片特征计算/检索失败，请重试';
                console.error(e);
            }
        }

        const imageDropzone = document.getElementById('image-dropzone');
        const imageFileInput = document.getElementById('image-file-input');
        imageDropzone.addEventListener('click', () => imageFileInput.click());
        imageFileInput.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (f) performImageSearch(f);
            e.target.value = '';
        });
        imageDropzone.addEventListener('dragover', (e) => { e.preventDefault(); imageDropzone.classList.add('bg-blue-50'); });
        imageDropzone.addEventListener('dragleave', () => imageDropzone.classList.remove('bg-blue-50'));
        imageDropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            imageDropzone.classList.remove('bg-blue-50');
            const f = e.dataTransfer.files[0];
            if (f) performImageSearch(f);
        });

        lucide.createIcons();
        updatePrefixUI();
        renderHistory();
        els.clearHistoryBtn.addEventListener('click', () => {
            try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
            renderHistory();
        });
        if (!applyShareLinkIfPresent()) loadRecentUpdates();
        loadHotSearches(); 
    });
    </script>
</body>
</html>
