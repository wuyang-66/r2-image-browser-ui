<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迅驰工具在线查询</title>
    <link rel="preconnect" href="https://xiaowuyang.dpdns.org">
    <link rel="preconnect" href="https://xiaowuya.dpdns.org">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --brand-color-from: #3b82f6;
            --brand-color-to: #14b8a6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }
        @keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-enter { animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .no-scroll { overflow: hidden; }

        .image-placeholder {
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .toggle-checkbox:checked { right: 0; border-color: var(--brand-color-from); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--brand-color-from); }

        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration {
            -webkit-appearance: none;
            display: none !important;
        }

        .search-type-btn {
            padding: 8px 16px;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: 500;
            background-color: white;
            color: #475569;
        }
        .search-type-btn.active {
            background-color: var(--brand-color-from);
            color: white;
            border-color: var(--brand-color-from);
        }
        
        #modal-image { cursor: zoom-in; }

        #suggestions-box { max-height: 320px; overflow-y: auto; }
        #suggestions-box::-webkit-scrollbar { width: 6px; }
        #suggestions-box::-webkit-scrollbar-track { background: #f1f5f9; }
        #suggestions-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="antialiased text-slate-800">

    <div id="prefix-toggle-container" class="absolute top-4 right-4 z-20 flex items-center">
        <label for="prefix-toggle" class="text-sm text-slate-600 mr-3 cursor-pointer">自动添加 "XC" 前缀</label>
        <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
            <input type="checkbox" name="prefix-toggle" id="prefix-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" checked/>
            <label for="prefix-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <header class="text-center mb-8 md:mb-12 pt-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[var(--brand-color-from)] to-[var(--brand-color-to)]">
                迅驰工具在线查询
            </h1>
            <p class="mt-3 text-lg text-slate-500">随时随地查询，实时同步更新</p>
        </header>

        <div id="search-type-switcher" class="flex justify-center mb-6 space-x-2">
            <button data-type="id" class="search-type-btn active">按编号搜索</button>
            <button data-type="name" class="search-type-btn">按名称/关键词搜索</button>
        </div>

        <div class="max-w-3xl mx-auto h-6 mb-1 text-center">
            <p id="search-validation-msg" class="text-sm font-medium transition-all duration-200 opacity-0 transform translate-y-1"></p>
        </div>

        <div class="max-w-3xl mx-auto flex items-center space-x-2">
            <div class="relative flex-grow" id="search-container">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
                </div>
                <div id="visual-prefix" class="absolute inset-y-0 left-10 flex items-center font-bold text-slate-400 pointer-events-none transition-opacity duration-200">
                    XC
                </div>
                <input type="search" id="search-input" placeholder="输入编号进行搜索..."
                       class="w-full pl-16 pr-10 py-3 text-base border-2 border-slate-200 rounded-full shadow-sm 
                              focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none
                              transition-all duration-300 ease-in-out"
                       autocomplete="off">
                <button id="clear-btn" class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer hidden">
                    <i data-lucide="x-circle" class="w-5 h-5 text-slate-400 hover:text-slate-600"></i>
                </button>
                
                <div id="suggestions-box" class="absolute z-40 w-full mt-2 bg-white rounded-2xl shadow-lg border border-slate-100 hidden">
                    <ul id="suggestions-list"></ul>
                </div>
            </div>
            
            <button id="search-btn" class="flex-shrink-0 px-6 py-3 font-semibold text-white bg-gradient-to-r from-[var(--brand-color-from)] to-[var(--brand-color-to)] rounded-full shadow-sm hover:opacity-90 disabled:opacity-50 transition-all">
                <span>搜索</span>
            </button>
        </div>

        <!-- 🌟 新增的热搜区域 -->
        <div id="hot-searches-container" class="max-w-3xl mx-auto mt-4 hidden items-center space-x-2 px-2 animate-fade-in">
            <span class="text-sm text-slate-500 flex items-center whitespace-nowrap shrink-0">
                <i data-lucide="flame" class="w-4 h-4 text-orange-500 mr-1"></i>热门搜索：
            </span>
            <div id="hot-searches-list" class="flex flex-wrap gap-2 items-center">
                <!-- 热搜关键词会动态插入到这里 -->
            </div>
        </div>
        
        <div id="results-count-container" class="max-w-3xl mx-auto mt-6 hidden"></div>
        
        <div id="recent-title" class="max-w-7xl mx-auto mt-10 mb-2 hidden flex items-center justify-between">
            <div class="flex items-center text-xl font-bold text-slate-700">
                <i data-lucide="sparkles" class="w-6 h-6 text-amber-500 mr-2"></i>
                近期更新
            </div>
            <span class="text-sm text-slate-400 bg-slate-100 px-3 py-1 rounded-full">New</span>
        </div>

        <main id="gallery" class="mt-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></main>

        <div id="load-more-container" class="mt-12 mb-12 flex flex-col items-center hidden">
            <button id="load-more-btn" class="px-8 py-3 bg-white border border-slate-200 text-slate-600 rounded-full font-medium hover:bg-slate-50 transition-colors shadow-sm flex items-center">
                <span id="load-more-text">加载更多结果</span>
                <i id="load-more-icon" data-lucide="chevron-down" class="ml-2 w-4 h-4"></i>
            </button>
        </div>

        <div id="gallery-message" class="mt-12"></div>
    </div>
    
    <!-- 详情弹窗 -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-overlay" class="absolute inset-0 bg-black/70 fade-in-bg"></div>
        <div id="modal-content" class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col md:flex-row overflow-hidden modal-enter">
            <div class="w-full md:w-3/5 bg-slate-100 flex items-center justify-center p-4 relative min-h-[300px]">
                <div id="modal-img-loader" class="absolute inset-0 flex items-center justify-center bg-slate-100 z-10">
                    <i data-lucide="loader-2" class="w-10 h-10 text-blue-500 animate-spin"></i>
                </div>
                <button id="modal-close-btn" class="absolute top-3 right-3 text-slate-500 hover:text-slate-800 transition-colors z-30 bg-white/80 shadow-sm rounded-full p-1">
                    <i data-lucide="x" class="w-7 h-7"></i>
                </button>
                <img id="modal-image" src="" alt="详情图片" class="max-w-full max-h-[40vh] md:max-h-[80vh] object-contain relative z-20 opacity-0 transition-opacity duration-300">
            </div>
            <div class="w-full md:w-2/5 p-8 overflow-y-auto">
                <h2 id="modal-title" class="text-3xl font-bold text-slate-800"></h2>
                <div class="mt-6 space-y-4 text-slate-600">
                    <div>
                        <h3 class="font-semibold text-slate-800">产品名称</h3>
                        <p id="modal-product-name"></p>
                    </div>
                    <div>
                        <h3 class="font-semibold text-slate-800">功能用途</h3>
                        <p id="modal-description" class="whitespace-pre-wrap"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 查看器 -->
    <div id="image-viewer" class="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <img id="viewer-image" src="" alt="全尺寸图片" class="max-w-[95vw] max-h-[95vh] object-contain rounded-lg shadow-2xl"/>
        <button id="viewer-close-btn" class="absolute top-4 right-4 text-white/80 hover:text-white transition-colors">
            <i data-lucide="x" class="w-10 h-10"></i>
        </button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const CONFIG = {
            API_WORKER_URL: "https://xiaowuyang.dpdns.org",
            R2_BUCKET_URL: "https://xiaowuya.dpdns.org",
            PAGE_LIMIT: 12,
            DEFAULT_PREFIX: "XC",
            MAX_CACHE_SIZE: 30 
        };

        const Cache = {
            store: new Map(),
            getKey: (type, query) => `${type}_${query.toLowerCase()}`,
            get: (type, query) => {
                const key = Cache.getKey(type, query);
                if (Cache.store.has(key)) {
                    const value = Cache.store.get(key);
                    Cache.store.delete(key);
                    Cache.store.set(key, value);
                    return value;
                }
                return null;
            },
            set: (type, query, data) => {
                const key = Cache.getKey(type, query);
                if (Cache.store.size >= CONFIG.MAX_CACHE_SIZE) {
                    const firstKey = Cache.store.keys().next().value;
                    Cache.store.delete(firstKey);
                }
                Cache.store.set(key, data);
            },
            clear: () => Cache.store.clear()
        };

        const state = { 
            debounceTimer: null, 
            isPrefixEnabled: true, 
            searchType: 'id',
            isValid: true,
            isLoading: false,
            nextCursor: null,
            nextOffset: 0,
            hasMore: false,
            loadedCount: 0,
            isShowingRecent: false,
            cachedRecentUpdates: null 
        };
        
        let searchAbortController = null;
        let suggestAbortController = null;

        const els = {
            searchInput: document.getElementById('search-input'),
            visualPrefix: document.getElementById('visual-prefix'),
            clearBtn: document.getElementById('clear-btn'),
            searchBtn: document.getElementById('search-btn'),
            gallery: document.getElementById('gallery'),
            galleryMsg: document.getElementById('gallery-message'),
            suggestionsBox: document.getElementById('suggestions-box'),
            suggestionsList: document.getElementById('suggestions-list'),
            loadMoreContainer: document.getElementById('load-more-container'),
            loadMoreBtn: document.getElementById('load-more-btn'),
            loadMoreText: document.getElementById('load-more-text'),
            loadMoreIcon: document.getElementById('load-more-icon'),
            resultsCount: document.getElementById('results-count-container'),
            recentTitle: document.getElementById('recent-title'), 
            validationMsg: document.getElementById('search-validation-msg'),
            prefixToggle: document.getElementById('prefix-toggle'),
            prefixContainer: document.getElementById('prefix-toggle-container'),
            hotSearchesContainer: document.getElementById('hot-searches-container'),
            hotSearchesList: document.getElementById('hot-searches-list'),
            modal: document.getElementById('modal'),
            modalImg: document.getElementById('modal-image'),
            viewer: document.getElementById('image-viewer'),
            viewerImg: document.getElementById('viewer-image')
        };

        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };

        function showMessage(type, message) {
            els.gallery.innerHTML = '';
            els.resultsCount.classList.add('hidden');
            els.loadMoreContainer.classList.add('hidden');
            let icon = type === 'loading' ? 'loader-2' : (type === 'error' ? 'alert-triangle' : 'search');
            let color = type === 'loading' ? 'text-blue-500' : (type === 'error' ? 'text-red-500' : 'text-slate-400');
            els.galleryMsg.innerHTML = `<div class="flex flex-col items-center justify-center min-h-[30vh] text-slate-500">
                <i data-lucide="${icon}" class="w-12 h-12 ${type === 'loading' ? 'animate-spin' : ''} ${color}"></i>
                <p class="mt-4 text-lg text-center">${escapeHTML(message)}</p>
            </div>`;
            lucide.createIcons({ root: els.galleryMsg });
        }

        function getEffectiveQuery() {
            let rawVal = els.searchInput.value;
            let val = state.searchType === 'id' ? rawVal.replace(/\s+/g, '') : rawVal.trim();

            if (state.searchType === 'id' && state.isPrefixEnabled) {
                if (val.toUpperCase().startsWith(CONFIG.DEFAULT_PREFIX.toUpperCase())) {
                    val = val.substring(CONFIG.DEFAULT_PREFIX.length);
                    if (els.searchInput.value !== val) els.searchInput.value = val;
                }
                return val ? CONFIG.DEFAULT_PREFIX + val : '';
            }
            return val;
        }

        function checkValidation() {
            const val = state.searchType === 'id' ? els.searchInput.value.replace(/\s+/g, '') : els.searchInput.value.trim();
            let isValid = true;
            let msg = "";

            if (state.searchType === 'id' && val.length > 0) {
                if (val.length < 2 && !state.isPrefixEnabled) {
                    isValid = false;
                    msg = `编号搜索必须输入至少两位字符`;
                }
            }

            state.isValid = isValid;
            if (!isValid) {
                els.validationMsg.textContent = msg;
                els.validationMsg.className = "text-sm font-medium transition-all opacity-100 text-red-500 transform translate-y-0";
                els.searchBtn.disabled = true;
            } else {
                els.validationMsg.className = "text-sm font-medium transition-all opacity-0 transform translate-y-1";
                els.searchBtn.disabled = false;
            }
            return isValid;
        }

        function updateClearBtnVisibility() {
            els.clearBtn.classList.toggle('hidden', els.searchInput.value === '');
        }

        function updatePrefixUI() {
            const showPrefix = state.searchType === 'id' && state.isPrefixEnabled;
            if (showPrefix) {
                els.visualPrefix.classList.remove('hidden');
                els.searchInput.classList.replace('pl-12', 'pl-16');
            } else {
                els.visualPrefix.classList.add('hidden');
                els.searchInput.classList.replace('pl-16', 'pl-12');
            }
        }

        function renderCards(images, append = false) {
            if (!append) els.gallery.innerHTML = '';
            els.galleryMsg.innerHTML = ''; 
            
            const fragment = document.createDocumentFragment();
            images.forEach((img) => {
                const originalUrl = `${CONFIG.R2_BUCKET_URL}/${img.key}`;
                const thumb = `${CONFIG.API_WORKER_URL}/cdn-cgi/image/width=400,height=400,fit=cover,format=auto,quality=75/${originalUrl}`;
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 group cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-400';
                card.style.animation = `popIn 0.5s ease-out forwards`;
                card.tabIndex = 0;
                
                card.dataset.original = originalUrl;
                card.dataset.displayName = escapeHTML(img.displayName);
                card.dataset.productName = escapeHTML(img.productName);
                card.dataset.description = escapeHTML(img.description || '正在完善中....');

                const newBadge = state.isShowingRecent 
                    ? `<div class="absolute top-2 right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm z-10">NEW</div>`
                    : '';

                card.innerHTML = `
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        ${newBadge}
                        <div class="absolute inset-0 image-placeholder animate-pulse"><i data-lucide="image" class="w-8 h-8 text-slate-300"></i></div>
                        <img src="${thumb}" loading="lazy" decoding="async" class="w-full h-full object-cover opacity-0 transition-opacity duration-500">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><p class="text-white font-bold text-lg">查看详情</p></div>
                    </div>
                    <div class="p-3 bg-slate-50"><p class="text-sm font-semibold text-slate-600 text-center truncate">${card.dataset.productName}</p><p class="text-xs text-slate-400 text-center mt-1">${card.dataset.displayName}</p></div>
                `;
                const imgEl = card.querySelector('img');
                imgEl.onload = () => { imgEl.style.opacity = '1'; card.querySelector('.image-placeholder').style.display = 'none'; };
                
                card.addEventListener('keydown', (e) => { if (e.key === 'Enter') card.click(); });
                
                fragment.appendChild(card);
            });
            els.gallery.appendChild(fragment);
            lucide.createIcons({ root: els.gallery });
        }

        function handleSearchResults(data, isLoadMore) {
             if (data.success) {
                if (!isLoadMore) {
                    state.loadedCount = 0;
                }
                
                state.loadedCount += data.images.length;
                renderCards(data.images, isLoadMore);
                
                state.hasMore = data.hasMore;
                state.nextCursor = data.nextCursor;
                state.nextOffset = data.nextOffset;

                els.loadMoreContainer.classList.toggle('hidden', !state.hasMore);
                
                if (state.loadedCount > 0) {
                    let countText = state.hasMore 
                        ? `已加载 ${state.loadedCount} 个结果，可继续下拉加载...` 
                        : `共为您找到 ${state.loadedCount} 个结果`;
                        
                    els.resultsCount.innerHTML = `<div class="flex items-center text-sm text-slate-500"><i data-lucide="check-circle-2" class="w-4 h-4 mr-2 text-teal-500"></i>${countText}</div>`;
                    els.resultsCount.classList.remove('hidden');
                    lucide.createIcons({ root: els.resultsCount });
                } else if (!isLoadMore && data.images.length === 0) {
                    showMessage('error', '未找到结果');
                }
            } else {
                showMessage('error', data.error || '未找到结果');
            }
        }

        async function loadRecentUpdates() {
            state.isLoading = true;
            state.isShowingRecent = true;
            els.recentTitle.classList.remove('hidden'); 
            els.resultsCount.classList.add('hidden'); 
            
            if (state.cachedRecentUpdates) {
                renderCards(state.cachedRecentUpdates, false);
                state.isLoading = false;
                return;
            }

            if (searchAbortController) searchAbortController.abort();
            searchAbortController = new AbortController();

            showMessage('loading', '正在获取最近收录的产品...');

            try {
                const resp = await fetch(`${CONFIG.API_WORKER_URL}/recent?limit=12`, { signal: searchAbortController.signal });
                const data = await resp.json();

                if (data.success && data.images && data.images.length > 0) {
                    state.cachedRecentUpdates = data.images; 
                    renderCards(data.images, false);
                } else {
                    showMessage('info', '暂无最近更新记录，请使用上方搜索框进行查询。');
                    els.recentTitle.classList.add('hidden');
                }
            } catch (e) {
                if (e.name === 'AbortError') return;
                showMessage('error', '加载最近更新失败，请重试');
            } finally {
                if (!searchAbortController.signal.aborted) {
                    state.isLoading = false;
                }
            }
        }

        // 🌟 新增：加载热搜数据
        async function loadHotSearches() {
            try {
                const resp = await fetch(`${CONFIG.API_WORKER_URL}/hot-searches`);
                const data = await resp.json();
                
                if (data.success && data.hotSearches && data.hotSearches.length > 0) {
                    els.hotSearchesList.innerHTML = '';
                    
                    data.hotSearches.forEach(keyword => {
                        const btn = document.createElement('button');
                        // 使用橙色主题让热搜标签更显眼
                        btn.className = 'px-3 py-1 text-xs font-medium bg-orange-50 text-orange-600 border border-orange-200 rounded-full hover:bg-orange-100 transition-colors shadow-sm cursor-pointer';
                        btn.textContent = keyword;
                        
                        // 点击热搜词自动执行搜索
                        btn.onclick = () => {
                            let searchVal = keyword;
                            
                            // 智能判断：如果关键词以 XC 开头，自动切换到编号搜索模式
                            if (keyword.toUpperCase().startsWith(CONFIG.DEFAULT_PREFIX.toUpperCase())) {
                                document.querySelector('[data-type="id"]').click();
                                els.prefixToggle.checked = true;
                                state.isPrefixEnabled = true;
                                updatePrefixUI();
                                searchVal = keyword.substring(CONFIG.DEFAULT_PREFIX.length); // 去掉 XC 填入输入框，前端会自动补上
                            } else {
                                // 否则切换到关键词搜索模式
                                document.querySelector('[data-type="name"]').click();
                            }
                            
                            els.searchInput.value = searchVal;
                            checkValidation();
                            updateClearBtnVisibility();
                            performSearch(false);
                        };
                        els.hotSearchesList.appendChild(btn);
                    });
                    
                    els.hotSearchesContainer.classList.remove('hidden');
                    els.hotSearchesContainer.classList.add('flex');
                    lucide.createIcons({ root: els.hotSearchesContainer });
                }
            } catch (e) {
                console.error('获取热门搜索失败', e);
            }
        }

        async function performSearch(isLoadMore = false) {
            if (!state.isValid || state.isLoading) return;
            const effectiveQuery = getEffectiveQuery();
            
            if (!effectiveQuery || (state.isPrefixEnabled && state.searchType === 'id' && effectiveQuery === CONFIG.DEFAULT_PREFIX)) {
                if (!isLoadMore) loadRecentUpdates();
                return;
            }

            if (!isLoadMore) {
                const cachedData = Cache.get(state.searchType, effectiveQuery);
                if (cachedData) {
                    state.isShowingRecent = false;
                    els.recentTitle.classList.add('hidden');
                    
                    state.nextCursor = null;
                    state.nextOffset = 0;
                    
                    handleSearchResults(cachedData, false);
                    return; 
                }
            }

            state.isLoading = true;
            state.isShowingRecent = false;
            els.recentTitle.classList.add('hidden');

            if (searchAbortController) searchAbortController.abort();
            searchAbortController = new AbortController();

            if (!isLoadMore) {
                state.nextCursor = null;
                state.nextOffset = 0;
                showMessage('loading', `正在搜索 "${effectiveQuery}"...`);
            } else {
                els.loadMoreBtn.disabled = true;
                els.loadMoreIcon.classList.add('animate-spin');
                els.loadMoreText.textContent = '正在加载...';
            }

            try {
                let url = `${CONFIG.API_WORKER_URL}/search?q=${encodeURIComponent(effectiveQuery)}&type=${state.searchType}&limit=${CONFIG.PAGE_LIMIT}`;
                if (state.searchType === 'name') url += `&offset=${state.nextOffset}`;
                else if (state.nextCursor) url += `&cursor=${encodeURIComponent(state.nextCursor)}`;

                const resp = await fetch(url, { signal: searchAbortController.signal });
                const data = await resp.json();

                if (data.success && !isLoadMore) {
                    Cache.set(state.searchType, effectiveQuery, data);
                }

                handleSearchResults(data, isLoadMore);

            } catch (e) {
                if (e.name === 'AbortError') return;
                showMessage('error', '连接服务器失败');
            } finally {
                if (!searchAbortController.signal.aborted) {
                    state.isLoading = false;
                    els.loadMoreBtn.disabled = false;
                    els.loadMoreIcon.classList.remove('animate-spin');
                    els.loadMoreText.textContent = '加载更多结果';
                }
            }
        }

        async function fetchSuggestions(query) {
            if (!query || state.searchType !== 'id' || !state.isValid) return;
            const effectiveQuery = getEffectiveQuery();

            if (suggestAbortController) suggestAbortController.abort();
            suggestAbortController = new AbortController();

            try {
                const response = await fetch(`${CONFIG.API_WORKER_URL}/suggest?q=${encodeURIComponent(effectiveQuery)}`, { signal: suggestAbortController.signal });
                const data = await response.json();
                
                if (data.success && data.suggestions) {
                    els.suggestionsList.innerHTML = '';
                    if (data.suggestions.length > 0) {
                        data.suggestions.forEach(s => {
                            const li = document.createElement('li');
                            li.className = 'px-4 py-3 cursor-pointer hover:bg-slate-100 transition-colors border-b border-slate-50 last:border-0';
                            
                            let displayText = escapeHTML(s);
                            if (state.isPrefixEnabled && s.toUpperCase().startsWith(CONFIG.DEFAULT_PREFIX.toUpperCase())) {
                                displayText = escapeHTML(s.substring(CONFIG.DEFAULT_PREFIX.length));
                            }
                            li.innerHTML = `<span class="text-slate-400 font-medium">${state.isPrefixEnabled ? CONFIG.DEFAULT_PREFIX : ''}</span>${displayText}`;
                            
                            li.addEventListener('mousedown', (e) => {
                                e.preventDefault();
                                els.searchInput.value = displayText;
                                els.suggestionsBox.classList.add('hidden');
                                checkValidation();
                                performSearch(false);
                            });
                            els.suggestionsList.appendChild(li);
                        });
                        els.suggestionsBox.classList.remove('hidden');
                    } else {
                        els.suggestionsBox.classList.add('hidden');
                    }
                }
            } catch (e) {}
        }

        els.searchInput.addEventListener('input', () => {
            let rawVal = els.searchInput.value;
            
            if (state.searchType === 'id' && state.isPrefixEnabled) {
                let trimmed = rawVal.trimStart();
                let upperPrefix = CONFIG.DEFAULT_PREFIX.toUpperCase();
                
                if (trimmed.toUpperCase().startsWith(upperPrefix)) {
                    let actualPrefix = trimmed.substring(0, upperPrefix.length);
                    els.visualPrefix.textContent = actualPrefix;
                    els.searchInput.value = trimmed.substring(upperPrefix.length).trimStart();
                } else if (els.searchInput.value === '') {
                    els.visualPrefix.textContent = CONFIG.DEFAULT_PREFIX;
                }
            }
            
            checkValidation();
            updateClearBtnVisibility();
            
            clearTimeout(state.debounceTimer);
            state.debounceTimer = setTimeout(() => {
                const val = state.searchType === 'id' ? els.searchInput.value.replace(/\s+/g, '') : els.searchInput.value.trim();
                fetchSuggestions(val);
            }, 300);
        });

        els.searchInput.addEventListener('keyup', (e) => { 
            if (e.key === 'Enter') performSearch(false); 
        });
        
        els.searchBtn.addEventListener('click', () => performSearch(false));
        els.loadMoreBtn.addEventListener('click', () => performSearch(true));

        els.clearBtn.addEventListener('click', () => {
            els.searchInput.value = '';
            els.visualPrefix.textContent = CONFIG.DEFAULT_PREFIX;
            checkValidation();
            updateClearBtnVisibility();
            
            if (searchAbortController) searchAbortController.abort();
            state.isLoading = false;
            
            els.suggestionsBox.classList.add('hidden');
            
            loadRecentUpdates();
            els.searchInput.focus();
        });

        document.getElementById('search-type-switcher').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            state.searchType = btn.dataset.type;
            
            document.querySelectorAll('.search-type-btn').forEach(b => b.classList.toggle('active', b === btn));
            els.prefixContainer.style.display = state.searchType === 'id' ? 'flex' : 'none';
            els.searchInput.placeholder = state.searchType === 'id' ? '输入编号进行搜索...' : '输入关键词进行搜索...';
            
            updatePrefixUI();
            els.searchInput.value = '';
            els.visualPrefix.textContent = CONFIG.DEFAULT_PREFIX;
            checkValidation();
            updateClearBtnVisibility();
            
            els.suggestionsBox.classList.add('hidden');
            
            if (searchAbortController) searchAbortController.abort();
            loadRecentUpdates();
        });

        els.prefixToggle.addEventListener('change', () => {
            state.isPrefixEnabled = els.prefixToggle.checked;
            updatePrefixUI();
            checkValidation();
            updateClearBtnVisibility();
            els.searchInput.focus();
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('search-container').contains(e.target)) {
                els.suggestionsBox.classList.add('hidden');
            }
        });

        els.gallery.addEventListener('click', (e) => {
            const card = e.target.closest('.group');
            if (!card) return;
            
            const originalUrl = card.dataset.original;
            const modalOptimizedUrl = `${CONFIG.API_WORKER_URL}/cdn-cgi/image/width=1200,fit=scale-down,format=auto,quality=85/${originalUrl}`;
            
            els.modalImg.classList.add('opacity-0');
            document.getElementById('modal-img-loader').classList.remove('hidden');
            
            els.modalImg.src = modalOptimizedUrl; 
            els.modalImg.dataset.fullOrigin = originalUrl;

            document.getElementById('modal-title').innerHTML = card.dataset.displayName;
            document.getElementById('modal-product-name').innerHTML = card.dataset.productName;
            document.getElementById('modal-description').innerHTML = card.dataset.description;
            
            els.modal.classList.remove('hidden');
            document.body.classList.add('no-scroll');
        });

        els.modalImg.onload = () => {
            els.modalImg.classList.remove('opacity-0');
            document.getElementById('modal-img-loader').classList.add('hidden');
        };

        const closeModal = () => { els.modal.classList.add('hidden'); document.body.classList.remove('no-scroll'); };
        document.getElementById('modal-overlay').addEventListener('click', closeModal);
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        
        els.modalImg.addEventListener('click', () => {
            els.viewerImg.src = els.modalImg.dataset.fullOrigin || els.modalImg.src;
            els.viewer.classList.remove('hidden');
        });

        const closeViewer = () => els.viewer.classList.add('hidden');
        document.getElementById('viewer-close-btn').addEventListener('click', closeViewer);
        els.viewer.addEventListener('click', (e) => { if (e.target !== els.viewerImg) closeViewer(); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeViewer();
                closeModal();
            }
        });

        // --- 初始化 ---
        lucide.createIcons();
        updatePrefixUI();
        
        loadRecentUpdates();
        loadHotSearches(); // 🌟 初始化时加载热门搜索
        
    });
    </script>
</body>
</html>
